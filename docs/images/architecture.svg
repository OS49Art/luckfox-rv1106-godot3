 class="body" text-anchor="start">Cross-build for board</text></g><g id="n-project" data-node="true"><rect x="50" y="420" width="340" height="150" rx="8" class="node neutral"/><text x="78" y="463" class="label" text-anchor="start">GDScript + assets</text><text x="78" y="500" class="body" text-anchor="start">Godot 3 content</text><text x="78" y="530" class="body" text-anchor="start">Matching export tools</text></g><g id="n-runtime" data-node="true"><rect x="530" y="170" width="340" height="150" rx="8" class="node neutral"/><text x="558" y="213" class="label" text-anchor="start">ARM32 / uClibc runtime</text><text x="558" y="250" class="body" text-anchor="start">SceneTree / GUI / GDScript</text><text x="558" y="280" class="body" text-anchor="start">Normal input dispatch</text></g><g id="n-pack" data-node="true"><rect x="530" y="420" width="340" height="150" rx="8" class="node neutral"/><text x="558" y="463" class="label" text-anchor="start">Godot 3 PCK</text><text x="558" y="500" class="body" text-anchor="start">Exported scripts + assets</text><text x="558" y="530" class="body" text-anchor="start">Current content package</text></g><g id="n-canvas" data-node="true"><rect x="1010" y="170" width="340" height="150" rx="8" class="node accent"/><text x="1038" y="213" class="label" text-anchor="start">CPU Canvas subset</text><text x="1038" y="250" class="body" text-anchor="start">360 x 360 logical pixels</text><text x="1038" y="280" class="body" text-anchor="start">Supported 2D instructions</text></g><g id="n-framebuffer" data-node="true"><rect x="1010" y="420" width="340" height="150" rx="8" class="node external"/><text x="1038" y="463" class="label" text-anchor="start">Framebuffer 720 x 720</text><text x="1038" y="500" class="body" text-anchor="start">Nearest-neighbor 2x</text><text x="1038" y="530" class="body" text-anchor="start">CPU presentation</text></g><g id="n-launcher" data-node="true"><rect x="50" y="690" width="340" height="150" rx="8" class="node neutral"/><text x="78" y="733" class="label" text-anchor="start">LVGL entry + supervisor</text><text x="78" y="770" class="body" text-anchor="start">Release input / singleton</text><text x="78" y="800" class="body" text-anchor="start">Native Linux pidfd helper</text></g><g id="n-input" data-node="true"><rect x="1010" y="690" width="340" height="150" rx="8" class="node external"/><text x="1038" y="733" class="label" text-anchor="start">evdev touch</text><text x="1038" y="770" class="body" text-anchor="start">Raw ABS → FB → logical</text><text x="1038" y="800" class="body" text-anchor="start">Into normal Godot GUI</text></g><text x="50" y="906" class="muted" text-anchor="start">Public adapter not board-validated. CPU subset; no default RGA.</text><text x="50" y="938" class="muted" text-anchor="start">Solid: build, data or control path. Dashed: reap / resume / reacquire only.</text></svg>
