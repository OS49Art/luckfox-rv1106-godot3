<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="960" viewBox="0 0 1400 960" role="img" aria-labelledby="title desc">
<title id="title">Godot 3 on RV1106G3</title><desc id="desc">Build the native ARM32/uClibc runtime and matching Godot 3 PCK. Public experimental integration design: LVGL entry plus native pidfd supervisor requires explicit input release/reacquire hooks. Godot uses a restricted CPU Canvas and exact 2x framebuffer presentation. evdev enters normal GUI input. Cleanup confirms child reaping before restore/resume; LVGL then reacquires input. See validation limits.</desc>
