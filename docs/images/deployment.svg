<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="960" viewBox="0 0 1400 960" role="img" aria-labelledby="title desc">
<title id="title">Safe deployment and rollback</title><desc id="desc">Public experimental integration design. Verify identity and preserve a matched runtime/PCK/launcher/supervisor release before inactive staging. Validate hashes and hooks; test GUI, framebuffer and reap/resume/reacquire. Preflight failure means stop. Failed restore preserves owned recovery material and requires investigation. See validation limits.</desc>
<metadata>Original artwork. Copyright (c) 2026 OS49Art. SPDX-License-Identifier: MIT.</metadata>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#526273"/></marker><marker id="arrow-risk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#a33b32"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#172b3b}.title{font-size:32px;font-weight:700}.label{font-size:24px;font-weight:700}.body{font-size:22px}.muted{font-size:22px;fill:#526273}.node{stroke:#9aa9b5;stroke-width:1.5}.neutral{fill:#f1f4f6}.accent{fill:#e3eff8;stroke:#3779a5;stroke-width:2.5}.external{fill:white}.riskbox{fill:#fff4f2;stroke:#a33b32}.edge{stroke:#526273;stroke-width:2.5;stroke-linejoin:round}.main{stroke-width:3}.feedback{stroke-dasharray:9 7}.risk{stroke:#a33b32}.zone{fill:none;stroke:#bdc7cf;stroke-width:1.5}</style>
<rect width="1400" height="960" fill="white"/><text x="50" y="56" class="title" text-anchor="start">Safe deployment and rollback</text><text x="50" y="101" class="muted" text-anchor="start">Preflight failure: STOP before changing files. Never guess identity or overwrite the only backup.</text><path id="e-step1" d="M 340 240 H 390" class="edge main" fill="none" marker-end="url(#arrow)"/><path id="e-step2" d="M 680 240 H 730" class="edge main" fill="none" marker-end="url(#arrow)"/><path id="e-step3" d="M 1020 240 H 1070" class="edge main" fill="none" marker-end="url(#arrow)"/><path id="e-step4" d="M 1215 320 V 375 H 250 V 450" class="edge main" fill="none" marker-end="url(#arrow)"/><path id="e-step5" d="M 450 525 H 500" class="edge main" fill="none" marker-end="url(#arrow)"/><path id="e-step6" d="M 900 525 H 950" class="edge main" fill="none" marker-end="url(#arrow)"/><path id="e-restore" d="M 700 600 V 730" class="edge risk" fill="none" marker-end="url(#arrow-risk)"/><text x="320" y="411" class="muted" text-anchor="start">Public integration design; hardware acceptance remains NOT_RUN.</text><text x="728" y="670" class="muted" text-anchor="start">Post-change failure: quiesce verified Godot;</text><text x="728" y="701" class="muted" text-anchor="start">recover only with verified identity / ownership.</text><g id="n-identity" data-node="true"><rect x="50" y="170" width="290" height="150" rx="8" class="node neutral"/><text x="78" y="213" class="label" text-anchor="start">1. Verify live identity</text><text x="78" y="250" class="body" text-anchor="start">Exe / lock / owners</text><text x="78" y="280" class="body" text-anchor="start">Framebuffer + touch</text></g><g id="n-backup" data-node="true"><rect x="390" y="170" width="290" height="150" rx="8" class="node neutral"/><text x="418" y="213" class="label" text-anchor="start">2. Matched backup</text><text x="418" y="250" class="body" text-anchor="start">Four-file release set</text><text x="418" y="280" class="body" text-anchor="start">Timestamp + hashes</text></g><g id="n-stage" data-node="true"><rect x="730" y="170" width="290" height="150" rx="8" class="node accent"/><text x="758" y="213" class="label" text-anchor="start">3. Stage release</text><text x="758" y="250" class="body" text-anchor="start">Four-file new release</text><text x="758" y="280" class="body" text-anchor="start">Inactive; no activation</text></g><g id="n-hashes" data-node="true"><rect x="1070" y="170" width="280" height="150" rx="8" class="node neutral"/><text x="1098" y="213" class="label" text-anchor="start">4. Verify hashes</text><text x="1098" y="250" class="body" text-anchor="start">Runtime / PCK</text><text x="1098" y="280" class="body" text-anchor="start">Launcher / supervisor</text></g><g id="n-entry" data-node="true"><rect x="50" y="450" width="400" height="150" rx="8" class="node neutral"/><text x="78" y="493" class="label" text-anchor="start">5. LVGL entry + helper</text><text x="78" y="530" class="body" text-anchor="start">Release input; singleton</text><text x="78" y="560" class="body" text-anchor="start">Native pidfd supervisor</text></g><g id="n-tests" data-node="true"><rect x="500" y="450" width="400" height="150" rx="8" class="node neutral"/><text x="528" y="493" class="label" text-anchor="start">6. Test input + framebuffer</text><text x="528" y="530" class="body" text-anchor="start">evdev → normal GUI; edges</text><text x="528" y="560" class="body" text-anchor="start">Same-state exact 2x oracle</text></g><g id="n-return" data-node="true"><rect x="950" y="450" width="400" height="150" rx="8" class="node neutral"/><text x="978" y="493" class="label" text-anchor="start">7. Verify LVGL recovery</text><text x="978" y="530" class="body" text-anchor="start">Reap / resume / reacquire</text><text x="978" y="560" class="body" text-anchor="start">Verify input + FB + lock</text></g><g id="n-restore" data-node="true"><rect x="500" y="730" width="850" height="180" rx="8" class="node riskbox"/><text x="528" y="773" class="label" text-anchor="start">8. Matched rollback / recovery</text><text x="528" y="810" class="body" text-anchor="start">Runtime + PCK + launcher + supervisor; verify every hash.</text><text x="528" y="840" class="body" text-anchor="start">Failed restore: retain backup, owned lock, snapshot and metadata.</text><text x="528" y="870" class="body" text-anchor="start">STOP / investigate; do not assume input was restored.</text></g><text x="50" y="663" class="muted" text-anchor="start">Release acceptance includes</text><text x="50" y="694" class="muted" text-anchor="start">launch, tests AND return.</text><text x="50" y="800" class="muted" text-anchor="start">Failure branch applies</text><text x="50" y="831" class="muted" text-anchor="start">after any post-change</text><text x="50" y="862" class="muted" text-anchor="start">release-check failure.</text><text x="50" y="946" class="muted" text-anchor="start">No firmware, display timing, partition, swap or network changes. Decision guide, not an installer.</text></svg>
